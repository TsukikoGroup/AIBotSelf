<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">AI BOT BY LISOVSKY</title>
  <desc id="description">Desktop Discord command assistant for Windows</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.52" stop-color="#12183c"/>
      <stop offset="1" stop-color="#25104a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3bd5ff"/>
      <stop offset="0.5" stop-color="#6751ff"/>
      <stop offset="1" stop-color="#d95cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="30" fill="url(#background)"/>
  <circle cx="1040" cy="30" r="210" fill="#6751ff" opacity="0.11"/>
  <circle cx="1130" cy="285" r="180" fill="#3bd5ff" opacity="0.08"/>
  <path d="M0 268 C270 194 390 350 664 270 S1030 196 1200 252 V320 H0Z" fill="#6751ff" opacity="0.08"/>

  <g transform="translate(86 64)">
    <rect width="190" height="190" rx="50" fill="#0a1234" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="95" cy="95" r="47" fill="#6751ff" opacity="0.95"/>
    <g stroke="#3bd5ff" stroke-width="10" stroke-linecap="round">
      <path d="M95 95 L95 28"/>
      <path d="M95 95 L162 95"/>
      <path d="M95 95 L95 162"/>
      <path d="M95 95 L28 95"/>
    </g>
    <g fill="#3bd5ff" filter="url(#glow)">
      <circle cx="95" cy="25" r="13"/>
      <circle cx="165" cy="95" r="13"/>
      <circle cx="95" cy="165" r="13"/>
      <circle cx="25" cy="95" r="13"/>
    </g>
    <circle cx="95" cy="95" r="13" fill="#fff"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="330" y="122" fill="#ffffff" font-size="54" font-weight="750" letter-spacing="1">AI BOT</text>
    <text x="330" y="172" fill="url(#accent)" font-size="34" font-weight="700" letter-spacing="3">BY LISOVSKY</text>
    <text x="332" y="218" fill="#aeb8dc" font-size="21">Discord command assistant for Windows</text>

    <g transform="translate(332 246)" font-size="15" font-weight="600">
      <rect width="92" height="32" rx="16" fill="#6751ff" opacity="0.22"/>
      <text x="46" y="21" text-anchor="middle" fill="#d9d5ff">v2.7.0</text>
      <rect x="104" width="126" height="32" rx="16" fill="#3bd5ff" opacity="0.14"/>
      <text x="167" y="21" text-anchor="middle" fill="#bcefff">Windows</text>
      <rect x="242" width="178" height="32" rx="16" fill="#d95cff" opacity="0.14"/>
      <text x="331" y="21" text-anchor="middle" fill="#f1c8ff">UP / BUMP / LIKE</text>
    </g>
  </g>
</svg>
